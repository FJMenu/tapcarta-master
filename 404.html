<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>TapCarta</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #0F0F0F;
    }

    #tapcarta-standard-frame {
      width: 100%;
      height: 100vh;
      border: 0;
      display: block;
      background: #0F0F0F;
    }
  </style>
</head>
<body>
  <script>
    const slug = window.location.pathname
      .replace(/^\/+|\/+$/g, '')
      .split('/')
      .filter(Boolean)
      .pop() || '';

    const target = '/standard-public/?slug=' + encodeURIComponent(slug);

    const iframe = document.createElement('iframe');
    iframe.id = 'tapcarta-standard-frame';
    iframe.src = target;
    iframe.title = 'TapCarta';
    document.body.appendChild(iframe);
  </script>
</body>
</html>
