<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">

  <title>TapCarta</title>

  <link id="tapcarta-manifest-link" rel="manifest" href="">
  <link id="tapcarta-apple-touch-icon" rel="apple-touch-icon" href="">
  <link rel="icon" type="image/png" href="/favicon.png">

  <meta name="theme-color" content="#0F0F0F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TapCarta">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #0F0F0F;
      overflow: hidden;
    }

    #tapcarta-standard-frame {
      width: 100%;
      height: 100vh;
      border: 0;
      display: block;
      background: #0F0F0F;
    }

  </style>
</head>

<body>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://uzuejudgccpnuzqefjre.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_FUtVznXw3Y0dftgEE7zgHg_aTbK669l';

    const tapCartaSupabase = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const slug = window.location.pathname
      .replace(/^\/+|\/+$/g, '')
      .split('/')
      .filter(Boolean)
      .pop() || '';

    const cleanRestaurantName = (value) => {
      const name = String(value || '').trim();
      return name || 'TapCarta';
    };

    const fallbackIconUrl = '/favicon.png';

    async function loadRestaurantForManifest() {
      if (!slug) {
        return {
          name: 'TapCarta',
          logoUrl: fallbackIconUrl
        };
      }

      try {
        const { data, error } = await tapCartaSupabase
          .from('restaurants')
          .select('name, slug, logo_url')
          .eq('slug', slug)
          .maybeSingle();

        if (error || !data) {
          return {
            name: 'TapCarta',
            logoUrl: fallbackIconUrl
          };
        }

        return {
          name: cleanRestaurantName(data.name),
          logoUrl: data.logo_url || fallbackIconUrl
        };
      } catch (error) {
        return {
          name: 'TapCarta',
          logoUrl: fallbackIconUrl
        };
      }
    }

    function createDynamicManifest({ name, logoUrl }) {
      const startUrl = window.location.origin + '/' + encodeURIComponent(slug) + '/';
      const appName = cleanRestaurantName(name);

      const manifest = {
        name: appName,
        short_name: appName,
        description: 'Menu digital ' + appName,
        start_url: startUrl,
        scope: startUrl,
        display: 'standalone',
        background_color: '#0F0F0F',
        theme_color: '#0F0F0F',
        orientation: 'portrait',
        icons: [
          {
            src: logoUrl,
            sizes: '192x192',
            type: 'image/png',
            purpose: 'any maskable'
          },
          {
            src: logoUrl,
            sizes: '512x512',
            type: 'image/png',
            purpose: 'any maskable'
          }
        ]
      };

      const manifestBlob = new Blob(
        [JSON.stringify(manifest)],
        { type: 'application/manifest+json' }
      );

      const manifestUrl = URL.createObjectURL(manifestBlob);

      const manifestLink = document.getElementById('tapcarta-manifest-link');
      if (manifestLink) {
        manifestLink.setAttribute('href', manifestUrl);
      }

      const appleIconLink = document.getElementById('tapcarta-apple-touch-icon');
      if (appleIconLink) {
        appleIconLink.setAttribute('href', logoUrl);
      }

      document.title = appName;
    }

    function loadStandardFrame() {
      const target = '/standard-public/?slug=' + encodeURIComponent(slug) + '&v=' + Date.now();

      const iframe = document.createElement('iframe');
      iframe.id = 'tapcarta-standard-frame';
      iframe.src = target;
      iframe.title = 'TapCarta';
      document.body.appendChild(iframe);
    }

    let deferredInstallPrompt = null;

    function isStandaloneMode() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    function sendInstallStateToStandard() {
      const frame = document.getElementById('tapcarta-standard-frame');
      if (!frame || !frame.contentWindow) return;

      frame.contentWindow.postMessage({
        source: 'tapcarta-404',
        type: 'tapcarta-install-state',
        canInstall: Boolean(deferredInstallPrompt) && !isStandaloneMode(),
        isStandalone: isStandaloneMode()
      }, window.location.origin);
    }

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      sendInstallStateToStandard();
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      sendInstallStateToStandard();
    });

    window.addEventListener('message', async (event) => {
      if (event.origin !== window.location.origin) return;
      if (!event.data || event.data.source !== 'tapcarta-standard') return;

      if (event.data.type === 'tapcarta-install-state-request') {
        sendInstallStateToStandard();
        return;
      }

      if (event.data.type !== 'tapcarta-install-request') return;

      if (!deferredInstallPrompt || isStandaloneMode()) {
        sendInstallStateToStandard();
        return;
      }

      deferredInstallPrompt.prompt();

      await deferredInstallPrompt.userChoice.catch(() => null);

      deferredInstallPrompt = null;
      sendInstallStateToStandard();
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js', {
          scope: '/',
          updateViaCache: 'none'
        }).catch(() => {});
      });
    }

    (async () => {
      const restaurantManifestData = await loadRestaurantForManifest();
      createDynamicManifest(restaurantManifestData);
      loadStandardFrame();
      setTimeout(sendInstallStateToStandard, 500);
    })();
  </script>
</body>
</html>
