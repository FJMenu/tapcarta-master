<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Redirection TapCarta</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0F0F0F">

  <link rel="icon" type="image/png" href="../favicon.png?v=1.0.13">
  <link rel="shortcut icon" type="image/png" href="../favicon.png?v=1.0.13">
  <link rel="apple-touch-icon" href="../favicon.png?v=1.0.13">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --gold: #F2C744;
      --dark: #0F0F0F;
      --cream: #FAF6EE;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1d1d1d 0, var(--dark) 55%);
      color: var(--cream);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: min(460px, 100%);
      border: 1px solid rgba(242, 199, 68, 0.28);
      background: rgba(0, 0, 0, 0.28);
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(242, 199, 68, 0.35);
      background: rgba(242, 199, 68, 0.1);
      color: var(--gold);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.15;
    }

    p {
      margin: 14px 0 0;
      color: rgba(250, 246, 238, 0.72);
      line-height: 1.55;
      font-size: 15px;
    }

    .loader {
      width: 34px;
      height: 34px;
      margin: 22px auto 0;
      border: 3px solid rgba(242, 199, 68, 0.22);
      border-top-color: var(--gold);
      border-radius: 999px;
      animation: spin 0.9s linear infinite;
    }

    .fallback {
      display: none;
      margin-top: 20px;
    }

    .fallback a {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(242, 199, 68, 0.35);
      background: rgba(242, 199, 68, 0.12);
      color: var(--gold);
      border-radius: 14px;
      padding: 12px 16px;
      text-decoration: none;
      font-weight: 800;
      font-size: 14px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge">TapCarta</div>
    <h1>Ouverture du restaurant...</h1>

    <p id="status-text">
      Nous vous redirigeons vers la page TapCarta du restaurant.
    </p>

    <div class="loader" id="loader"></div>

    <div class="fallback" id="fallback">
      <a id="fallback-link" href="https://tapcarta.com/">Ouvrir TapCarta</a>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://uzuejudgccpnuzqefjre.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_FUtVznXw3Y0dftgEE7zgHg_aTbK669l';

    const tapCartaSupabase = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    function getQrCodeFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('c') || params.get('code') || params.get('qr');

      return String(code || '')
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9-]/g, '');
    }

    function showError(message, fallbackUrl = 'https://tapcarta.com/') {
      const statusText = document.getElementById('status-text');
      const loader = document.getElementById('loader');
      const fallback = document.getElementById('fallback');
      const fallbackLink = document.getElementById('fallback-link');

      if (statusText) statusText.textContent = message;
      if (loader) loader.style.display = 'none';

      if (fallback && fallbackLink) {
        fallback.style.display = 'block';
        fallbackLink.href = fallbackUrl;
      }
    }

    async function redirectToRestaurant() {
      const qrCode = getQrCodeFromUrl();

      if (!qrCode) {
        showError('Ce QR TapCarta est incomplet. Veuillez vérifier le lien scanné.');
        return;
      }

      try {
        const { data, error } = await tapCartaSupabase
          .from('restaurants')
          .select('id, name, status, public_url, slug, qr_code')
          .eq('qr_code', qrCode)
          .maybeSingle();

        if (error) {
          throw error;
        }

        if (!data || !data.id) {
          showError('Ce QR TapCarta n’est pas encore actif ou n’a pas été trouvé.');
          return;
        }

        const publicUrl =
          data.public_url ||
          (data.slug ? `https://tapcarta.com/${data.slug}/` : '');

        if (!publicUrl) {
          showError('La page TapCarta de ce restaurant n’est pas encore configurée.');
          return;
        }

        window.location.replace(publicUrl);
      } catch (error) {
        console.error('Erreur redirection QR TapCarta:', error);
        showError('Impossible d’ouvrir ce QR pour le moment. Veuillez réessayer dans quelques instants.');
      }
    }

    redirectToRestaurant();
  </script>
</body>
</html>
